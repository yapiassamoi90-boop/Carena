  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #1e3a8a 0%, #2563eb 50%, #3b82f6 100%);
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --primary: #2563eb;
      --accent: #d97706;
      --accent-bg: #fef3c7;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background: var(--bg-gradient);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem 1rem;
      background-attachment: fixed;
    }

    header {
      width: 100%;
      max-width: 600px;
      margin-bottom: 1.5rem;
      text-align: center;
    }

    header h1 {
      font-size: 1.6rem;
      color: #ffffff;
      margin-bottom: 0.25rem;
      text-shadow: 0 2px 4px rgba(0,0,0,0.2);
    }

    .signature {
      font-size: 0.85rem;
      color: #93c5fd;
      font-weight: bold;
      letter-spacing: 0.5px;
    }

    .search-box {
      width: 100%;
      max-width: 600px;
      position: sticky;
      top: 1rem;
      z-index: 10;
      margin-bottom: 0.5rem;
    }

    input[type="text"] {
      width: 100%;
      padding: 1rem 1.2rem;
      font-size: 1.1rem;
      border-radius: 14px;
      border: none;
      background-color: var(--card-bg);
      color: var(--text);
      outline: none;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.15), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      transition: all 0.2s ease;
    }

    input[type="text"]:focus {
      box-shadow: 0 15px 30px -5px rgba(37, 99, 235, 0.3);
      transform: translateY(-1px);
    }

    .stats {
      margin: 0.5rem 0 1rem 0;
      font-size: 0.9rem;
      color: #e2e8f0;
      width: 100%;
      max-width: 600px;
      display: flex;
      justify-content: space-between;
      font-weight: 500;
    }

    .results-list {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .card {
      background-color: var(--card-bg);
      padding: 1.1rem;
      border-radius: 12px;
      border: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }

    .card-code {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--accent);
      background-color: var(--accent-bg);
      padding: 0.4rem 0.8rem;
      border-radius: 8px;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .card-caption {
      font-size: 0.95rem;
      padding-right: 0.75rem;
      line-height: 1.4;
      color: var(--text);
      font-weight: 500;
    }

    .no-result {
      text-align: center;
      padding: 2.5rem;
      color: #f1f5f9;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      backdrop-filter: blur(5px);
      font-size: 1rem;
    }

    .highlight {
      background-color: #fde047;
      color: #854d0e;
      padding: 0 3px;
      border-radius: 3px;
      font-weight: 600;
    }
  </style>
</head>

    function normalizeStr(str) {
      return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
    }

    const searchInput = document.getElementById('searchInput');
    const resultsList = document.getElementById('resultsList');
    const resultCount = document.getElementById('resultCount');

    function displayResults(query = "") {
      const cleanQuery = normalizeStr(query.trim());
      resultsList.innerHTML = "";

      const filtered = items.filter(item => {
        const cleanCode = normalizeStr(item.code);
        const cleanCaption = normalizeStr(item.caption);
        
        const queryWords = cleanQuery.split(/\s+/);
        return queryWords.every(word => {
          // Gère automatiquement le singulier/pluriel (ex: "caniveau" trouve "caniveaux")
          const singularWord = word.replace(/[sx]$/, '');
          return cleanCode.includes(word) || cleanCaption.includes(word) || 
                 (singularWord.length > 2 && cleanCaption.includes(singularWord));
        });
      });

      resultCount.textContent = `${filtered.length} résultat(s) trouvé(s)`;

      if (filtered.length === 0) {
        resultsList.innerHTML = `<div class="no-result">Aucun résultat trouvé pour "${query}"</div>`;
        return;
      }

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';

        let captionHTML = item.caption;
        if (cleanQuery !== "") {
          const regex = new RegExp(`(${cleanQuery.split(/\s+/).join('|')})`, 'gi');
          captionHTML = item.caption.replace(regex, '<span class="highlight">$1</span>');
        }

        card.innerHTML = `
          <div class="card-caption">${captionHTML}</div>
          <div class="card-code">${item.code}</div>
        `;
        resultsList.appendChild(card);
      });
    }

    searchInput.addEventListener('input', (e) => {
      displayResults(e.target.value);
    });

    displayResults();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker enregistré !', reg))
          .catch(err => console.log('Erreur SW:', err));
      });
    }
